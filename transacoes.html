<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FinDash — Transações</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base:       #0c0d10;
      --bg-card:       #13151a;
      --bg-card2:      #1a1d24;
      --bg-input:      #1f2229;
      --border:        rgba(255,255,255,0.07);
      --accent:        #c8f135;
      --accent-dim:    rgba(200,241,53,0.12);
      --red:           #ff5f57;
      --red-dim:       rgba(255,95,87,0.12);
      --text-primary:  #f0f0f0;
      --text-secondary:#8a8f9e;
      --text-dim:      #4a4f5e;
      --radius-sm:     8px;
      --radius-md:     14px;
      --font-display:  'Syne', sans-serif;
      --font-mono:     'DM Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-mono); background: var(--bg-base); color: var(--text-primary); min-height: 100vh; background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 28px 28px; }
    .app { display: flex; min-height: 100vh; }

    .sidebar { width: 220px; min-height: 100vh; background: var(--bg-card); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 28px 16px; position: fixed; top: 0; left: 0; bottom: 0; }
    .logo { font-family: var(--font-display); font-size: 22px; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; margin-bottom: 36px; padding-left: 8px; }
    .logo span { color: var(--text-secondary); font-weight: 400; }
    .nav-btn { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); border: none; background: transparent; color: var(--text-secondary); font-family: var(--font-mono); font-size: 13px; cursor: pointer; width: 100%; text-align: left; transition: all 0.18s; margin-bottom: 4px; }
    .nav-btn:hover { background: var(--bg-card2); color: var(--text-primary); }
    .nav-btn.active { background: var(--accent-dim); color: var(--accent); }
    .nav-btn .icon { font-size: 16px; width: 20px; text-align: center; }
    .sidebar-footer { margin-top: auto; font-size: 11px; color: var(--text-dim); padding-left: 8px; line-height: 1.6; }

    .content { margin-left: 220px; flex: 1; padding: 32px 36px; max-width: calc(100% - 220px); }
    .page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 16px; }
    .page-title { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
    .page-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

    .transactions-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 22px; animation: fadeUp 0.4s ease both; }
    .tx-list { display: flex; flex-direction: column; gap: 10px; }
    .tx-item { display: flex; align-items: center; gap: 16px; padding: 14px 16px; background: var(--bg-card2); border-radius: var(--radius-sm); border: 1px solid var(--border); transition: transform 0.2s; }
    .tx-item:hover { transform: translateX(4px); border-color: var(--border); }
    .tx-icon { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .tx-info { flex: 1; min-width: 0; }
    .tx-desc { font-size: 14px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; }
    .tx-cat { font-size: 12px; color: var(--text-secondary); }
    .tx-right { text-align: right; flex-shrink: 0; }
    .tx-value { font-size: 15px; font-family: var(--font-display); font-weight: 700; margin-bottom: 4px; }
    .tx-value.pos { color: var(--accent); }
    .tx-value.neg { color: var(--red); }
    .tx-date { font-size: 12px; color: var(--text-dim); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="logo">Fin<span>Dash</span></div>

    <button class="nav-btn" onclick="window.location.href='home.html'">
      <span class="icon">◈</span> Dashboard
    </button>
    <button class="nav-btn active" onclick="window.location.href='transacoes.html'">
      <span class="icon">⇌</span> Transações
    </button>
    <button class="nav-btn" onclick="window.location.href='metas.html'">
      <span class="icon">◎</span> Metas
    </button>

    <div class="sidebar-footer">FinDash v1.0<br>Dados fictícios</div>
  </aside>

  <main class="content">
    <div class="page-header">
      <div>
        <div class="page-title">Histórico de Transações</div>
        <div class="page-subtitle">Visualize todas as entradas e saídas</div>
      </div>
    </div>

    <div class="transactions-card">
      <div class="tx-list" id="listaCompleta"></div>
    </div>
  </main>
</div>

<script>
  const transacoes = [
    { tipo:'receita',  desc:'Salário',         valor:5500, cat:'Salário',     data:'15 Jul 2026' },
    { tipo:'receita',  desc:'Freelance',       valor:1200, cat:'Freelance',   data:'12 Jul 2026' },
    { tipo:'despesa',  desc:'Aluguel',         valor:1500, cat:'Moradia',     data:'05 Jul 2026' },
    { tipo:'despesa',  desc:'Supermercado',    valor:620,  cat:'Alimentação', data:'03 Jul 2026' },
    { tipo:'despesa',  desc:'Uber / Combustível',valor:210,cat:'Transporte',  data:'02 Jul 2026' },
    { tipo:'despesa',  desc:'Streaming',       valor:85,   cat:'Lazer',       data:'01 Jul 2026' },
    { tipo:'receita',  desc:'Salário',         valor:5500, cat:'Salário',     data:'15 Jun 2026' },
    { tipo:'despesa',  desc:'Aluguel',         valor:1500, cat:'Moradia',     data:'05 Jun 2026' }
  ];

  const icones = {
    'Alimentação':'🍽', 'Transporte':'🚌', 'Moradia':'🏠',
    'Saúde':'💊', 'Lazer':'🎬', 'Educação':'📚',
    'Salário':'💼', 'Freelance':'💻', 'Outros':'📦'
  };

  function formatBRL(n) {
    return n.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
  }

  function renderizarTransacoes() {
    const cont = document.getElementById('listaCompleta');
    cont.innerHTML = transacoes.map(t => `
      <div class="tx-item">
        <div class="tx-icon" style="background:${t.tipo==='receita' ? 'var(--accent-dim)' : 'var(--red-dim)'}">
          ${icones[t.cat] || '💳'}
        </div>
        <div class="tx-info">
          <div class="tx-desc">${t.desc}</div>
          <div class="tx-cat">${t.cat}</div>
        </div>
        <div class="tx-right">
          <div class="tx-value ${t.tipo==='receita' ? 'pos' : 'neg'}">
            ${t.tipo==='receita' ? '+' : '-'}${formatBRL(t.valor)}
          </div>
          <div class="tx-date">${t.data}</div>
        </div>
      </div>
    `).join('');
  }

  renderizarTransacoes();
</script>
</body>
</html>
